services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2
    # -js enables JetStream, -sd sets the on-disk store directory
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT}:4222"
      - "${NATS_MONITOR_PORT}:8222"
    volumes:
      - natsdata:/data

  # Web UI to inspect the DuckLake catalog (the ducklake_* tables in Postgres)
  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - postgres

  # Web UI to inspect the JetStream log (streams, messages, consumers)
  nui:
    image: ghcr.io/nats-nui/nui:latest
    ports:
      - "${NUI_PORT}:31311"
    volumes:
      - nuidata:/db
    depends_on:
      - nats

volumes:
  pgdata:
  natsdata:
  nuidata: